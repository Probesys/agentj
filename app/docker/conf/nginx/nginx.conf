# Nginx configuration

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/agentj/public;

    # Files uploaded by the admins (e.g. domain logos): never run scripts
    # from them, even if a SVG is opened directly in the browser.
    location ^~ /files/upload/ {
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        # try to serve file directly, fallback to app.php
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_index index.php;
        fastcgi_pass unix:/run/php/php8-fpm.sock;
        include fastcgi_params;
        fastcgi_param HTTP_HOST $host$HTTP_HOST_PORT;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }
}
