; An ini file is required because cron and sudo reset the environment (i.e. XDEBUG_* variables are lost).
; PHP commands try to connect to the IDE when they start, and silently continue if it isn't listening.
xdebug.mode = develop,debug
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.start_with_request = yes
xdebug.log_level = 0
