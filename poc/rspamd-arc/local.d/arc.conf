path = "/var/lib/rspamd/arc/arc.private";
selector = "arc-202608";

use_domain = "arc.agentj.test";
use_esld = false;
try_fallback = true;

sign_authenticated = false;
sign_local = true;
sign_inbound = true;

allow_envfrom_empty = true;
allow_hdrfrom_mismatch = true;
allow_hdrfrom_multiple = false;

reuse_auth_results = true;
check_pubkey = true;
allow_pubkey_mismatch = false;
adjust_dmarc = false;
